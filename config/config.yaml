# Columns to drop during data cleaning
drop_cols:
  - "pos_touches"
  - "Att Pen"
  - "id"

# Categorical columns used in the analysis
categorical_columns:
  - "id"
  - "element_type"
  - "web_name"
  - "team_name"
  - "opponent_team_name"
  - "was_home"
  - "gameweek"

numerical_columns:
  - "gameweek"
  - "minutes"
  - "now_cost"
  - "selected_by_percent"
  - "total_shots"
  - "shots_on_target"
  - "shots_in_box"
  - "expected_goals"
  - "non_penalty_expected_goals"
  - "goals"
  - "non_penalty_goals"
  - "chances_created"
  - "expected_assists"
  - "assists"
  - "expected_goals_conceded"
  - "goals_conceded"
  - "expected_clean_sheet"
  - "clean_sheet"
  - "expected_goal_involvements"
  - "non_penalty_expected_goal_involvements"
  - "expected_points"
  - "PvsxP"
  - "carries_final_third"
  - "carries_penalty_area"
  - "clearances"
  - "shot_blocks"
  - "interceptions"
  - "recoveries"
  - "tackles"
  - "touches"
  - "touches_opp_box"
  - "clearances_blocks_interceptions"
  - "defensive_contribution"

# Target column for model training
target_column:
  - "total_points"

# Runtime inference behavior
inference:
  history_window: 5
  minimum_successful_models: 3
  cache_fixtures: true
  fixture_cache_ttl_seconds: 300
  clip_min: 0.0
  max_players_per_team: 3
  # An open gameweek's live prediction is reused for this long (0 disables),
  # unless official availability (injuries, suspensions) changes sooner.
  prediction_cache_ttl_seconds: 300
  # Up to this age, the web page may get an older one at once; it then asks
  # for POST /api/scout/refresh, where the new prediction runs. Other callers
  # predict first.
  prediction_stale_seconds: 900
  # After a cold start, the web page may get the open gameweek's archived
  # forecast the same way, if it is at most this old (0 disables).
  prediction_restore_max_age_seconds: 3600
  cold_start:
    enabled: true

official_fpl:
  base_url: "https://fantasy.premierleague.com/api"
  timeout_seconds: 20
  cache_ttl_seconds: 300
  history_cache_ttl_seconds: 900
  max_workers: 8

# Temporary, permission-pending enrichment of missing historical match inputs.
# Official FPL remains authoritative for player identity, history, and fixtures.
fpl_data_inference:
  enabled: true
  start_gameweek: 2
  season: "2026_27"
  local_path: "data/external/fpl-data-stats-2027.csv"
  runtime_cache_path: "data/external/fpl-data-stats-2027.csv"
  refresh_ttl_seconds: 21600
  minimum_match_ratio: 0.8
  # FPL Data publishes a gameweek after it appears in official history. Within
  # this lag the newest gameweek stays official-only; beyond it, no enrichment.
  max_gameweek_lag: 1
  timeout_seconds: 60
  permission_status: "pending"
  # The owner accepts the pending permission, so the service downloads FPL
  # Data itself. Set FPL_DATA_ACKNOWLEDGE_PERMISSION_PENDING=false to use only
  # files imported with the guarded CLI, whatever the permission status.
  acknowledge_permission_pending: true

# Durable artifacts for future training. In Cloud Run, the data root must be a
# writable bucket volume. Set OPENFPL_DATA_ROOT=/data for a /data mount.
data_archive:
  enabled: true
  root_path: "data/archive"
  season: "auto"
  # Serving frozen forecasts still archives official results this often.
  results_interval_seconds: 300

# Full-data refits from training/runs/2026-11-12-international-break-holdout5 (93,317 rows through GW10).
# Production review: training/history/2026-11-12-production-selection/selection.md
# Weights calibrated on 5,952 rolling predictions for current-season GW2-10
# (2026-11-22); GW1 uses the separate ownership cold-start path.
# Calibration RMSE: 2.034931 -> 2.031150. Earlier-period weights did not improve
# later-period validation RMSE; final weights have no independent test score.
# Evidence: training/runs/2026-11-22-ensemble-weights/{results,validation}.json
models:
  linear_regression:
    version: "2026-11-12-production-selected"
    last_trained: "November 12, 2026"
    path: "models/linear_regression_reg.pkl"
    year: 2026-2027
    weight: 0.010000

  xgboost:
    version: "2026-11-12-production-selected"
    last_trained: "November 12, 2026"
    path: "models/xgboost_reg.pkl"
    year: 2026-2027
    weight: 0.283799

  catboost:
    version: "2026-11-12-production-selected"
    last_trained: "November 12, 2026"
    path: "models/catboost_reg.pkl"
    year: 2026-2027
    weight: 0.547258

  mlp:
    version: "2026-11-12-production-selected"
    last_trained: "November 12, 2026"
    path: "models/mlp_reg.pkl"
    year: 2026-2027
    weight: 0.158943

version: "6.5.0"
