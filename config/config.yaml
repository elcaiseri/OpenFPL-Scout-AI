# Columns to drop during data cleaning
drop_cols:
  - "pos_touches"
  - "Att Pen"
  - "id"

# Categorical columns used in the analysis
categorical_columns:
  - "id"
  - "element_type"
  - "web_name"
  - "team_name"
  - "opponent_team_name"
  - "was_home"
  - "gameweek"

numerical_columns:
  - "gameweek"
  - "minutes"
  - "now_cost"
  - "selected_by_percent"
  - "total_shots"
  - "shots_on_target"
  - "shots_in_box"
  - "expected_goals"
  - "non_penalty_expected_goals"
  - "goals"
  - "non_penalty_goals"
  - "chances_created"
  - "expected_assists"
  - "assists"
  - "expected_goals_conceded"
  - "goals_conceded"
  - "expected_clean_sheet"
  - "clean_sheet"
  - "expected_goal_involvements"
  - "non_penalty_expected_goal_involvements"
  - "expected_points"
  - "PvsxP"
  - "carries_final_third"
  - "carries_penalty_area"
  - "clearances"
  - "shot_blocks"
  - "interceptions"
  - "recoveries"
  - "tackles"
  - "touches"
  - "touches_opp_box"
  - "clearances_blocks_interceptions"
  - "defensive_contribution"
  - "points_last"
  - "points_mean_3"
  - "points_mean_5"
  - "points_mean_10"
  - "points_std_5"
  - "points_trend_3_10"
  - "minutes_last"
  - "minutes_mean_3"
  - "minutes_mean_10"
  - "minutes_std_5"
  - "appearance_probability_5"
  - "start_probability_5"
  - "expected_goal_involvements_mean_3"
  - "expected_goal_involvements_mean_10"
  - "expected_points_last"
  - "fixture_difficulty"
  - "fixture_count"

# Target column for model training
target_column:
  - "total_points"

# Runtime inference behavior
inference:
  history_window: 5
  minimum_successful_models: 3
  cache_fixtures: true
  clip_min: 0.0

official_fpl:
  base_url: "https://fantasy.premierleague.com/api"
  timeout_seconds: 20
  cache_ttl_seconds: 300
  history_cache_ttl_seconds: 900
  max_workers: 8


# Model Information
models:
  linear_regression:
    version: "v6.0"
    last_trained: "August 14, 2026"
    path: "models/linear_regression_reg.pkl"
    weight: 0.17144892586501903
    year: 2026-2027

  xgboost:
    version: "v6.0"
    last_trained: "August 14, 2026"
    path: "models/xgboost_reg.pkl"
    weight: 0.22543569969141847
    year: 2026-2027

  catboost:
    version: "v6.0"
    last_trained: "August 14, 2026"
    path: "models/catboost_reg.pkl"
    weight: 0.519796858425605
    year: 2026-2027

  mlp:
    version: "v2.0"
    last_trained: "August 14, 2026"
    path: "models/mlp_reg.pkl"
